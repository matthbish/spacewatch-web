<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>SpaceWatch — upcoming rocket launches</title>
    <meta name="description" content="A quiet, local-first tracker for upcoming rocket launches: live countdowns, favorites, and launch reminders. No account, no tracking." />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/png" href="icons/favicon-64.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpaceWatch" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SpaceWatch" />
    <meta property="og:title" content="SpaceWatch — upcoming rocket launches" />
    <meta property="og:description" content="Live countdowns, favorites, and reminders for upcoming rocket launches. Quiet, local-first, no account." />
    <meta property="og:url" content="https://matthbish.github.io/spacewatch-web/" />
    <meta property="og:image" content="https://matthbish.github.io/spacewatch-web/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://matthbish.github.io/spacewatch-web/" />

    <script>
      // Resolve the theme before first paint so there's never a light flash on a dark device.
      try {
        var t = (JSON.parse(localStorage.getItem('spacewatch.settings') || '{}') || {}).theme;
        var dark = t === 'DARK' || (t !== 'LIGHT' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>SpaceWatch needs JavaScript to load launch data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
